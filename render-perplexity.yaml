services:
  - type: web
    name: netcookies-perplexity-checker
    runtime: python
    buildCommand: pip install -r requirements-perplexity.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT perplexity_api:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
